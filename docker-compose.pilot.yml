services:
  oravia:
    build:
      context: .
      dockerfile: Dockerfile
    image: oravia-pilot:local
    restart: unless-stopped
    ports:
      - "3110:3000"
    env_file:
      - .env.pilot.local
    environment:
      NODE_ENV: production
      ORAVIA_RUNTIME_ENV: production
      ORAVIA_STORAGE_MODE: sqlite
      ORAVIA_SQLITE_DATABASE_PATH: /data/oravia.sqlite
    volumes:
      - oravia-pilot-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  oravia-pilot-data:
